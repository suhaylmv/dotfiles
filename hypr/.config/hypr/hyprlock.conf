# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

source = /home/suhaylmv/.local/state/theme/current/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1    # same curve as hyprland.lua
    animation = fadeIn, 1, 4, md3_decel
    animation = fadeOut, 1, 4, md3_decel
    animation = inputFieldDots, 1, 2, md3_decel
}

# current wallpaper, set by wall
background {
    monitor =
    path = /home/suhaylmv/.local/state/theme/wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.9
    vibrancy = 0.17
}

# tint over the blur
shape {
    monitor =
    size = 100%, 100%
    color = $tint
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $fg_strong
    font_size = 120
    font_family = Readex Pro Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, 180
    halign = center
    valign = center
}

# date, in English (LC_TIME is es_ES)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %-d %B"
    color = $fg
    font_size = 20
    font_family = Readex Pro
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, 75
    halign = center
    valign = center
}

# password
input-field {
    monitor =
    size = 260, 46
    rounding = -1
    outline_thickness = 1
    outer_color = $line
    inner_color = rgba(00000000)
    font_color = $fg_strong
    check_color = $accent
    fail_color = $red
    capslock_color = $sand
    font_family = Readex Pro
    placeholder_text =
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    position = 0, -70
    halign = center
    valign = center
}

# keyboard layout
label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $muted
    font_size = 12
    font_family = Readex Pro Medium
    position = -30, 28
    halign = right
    valign = bottom
}
